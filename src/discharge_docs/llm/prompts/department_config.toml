    "Aangevraagde onderzoeken", 
    "Allergieën",
    "Correspondentie",
    "Endoscopie verslagen",
    "Informed Consent",
    "Intoxicaties",
    "Laboratorium",
    "Microbiologie", 
    "Multimedia",
    "Pathologie",
    "Radiologie",
    "Risicofactoren", 
    "Sociale anamnese",
    "Speciële anamnese",
    "Tractus anamnese",
    "Vitale functies",
]

[department.ORT]
id = "ORT"
display_name = "Orthopedie"
ehr = "HiX"
department_prompt = "ORT_prompt.txt"
post_processing = false
column_description_set = ["descriptions_hix"]
